name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -c backend/requirements.lock -e './backend[test]'
      - run: python -m pytest -q
        working-directory: backend
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.fixtures.yaml --profile fixtures config --quiet
      - run: docker build -t p100-lab:phase1 .
      - run: python3 tests/container_smoke.py
